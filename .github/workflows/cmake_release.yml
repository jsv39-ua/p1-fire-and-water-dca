name: CMake Release Build

on:
  release:
    types: [created, published]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'dev-build'

jobs:
  build-windows:
    name: Build Windows (CMake)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -G "MinGW Makefiles"

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Package Windows Release
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -match 'refs/tags/(.*)') { $matches[1] } else { "${{ github.event.inputs.version }}" }
          $packageName = "fire-and-water-dca-windows-$version"
          
          New-Item -ItemType Directory -Force -Path "$packageName"
          
          # Copiar ejecutable desde build
          if (Test-Path "build/game.exe") {
            Copy-Item "build/game.exe" "$packageName/"
          } elseif (Test-Path "build/Release/game.exe") {
            Copy-Item "build/Release/game.exe" "$packageName/"
          }
          
          # Copiar assets
          Copy-Item -Recurse "assets" "$packageName/"
          
          # Copiar DLLs si existen
          if (Test-Path "build/*.dll") {
            Copy-Item "build/*.dll" "$packageName/"
          }
          if (Test-Path "vendor/lib/windows/*.dll") {
            Copy-Item "vendor/lib/windows/*.dll" "$packageName/"
          }
          
          # Crear README
          @"
          # Fire and Water DCA - Windows Release
          
          Version: $version
          Build: CMake Release
          Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
          
          ## Instrucciones
          
          1. Ejecuta game.exe
          2. ¡Disfruta del juego!
          
          ## Requisitos del Sistema
          
          - Windows 10 o superior (64-bit)
          - DirectX compatible graphics card
          - Visual C++ Redistributable (incluido si es necesario)
          
          ## Controles
          
          Jugador 1 (Fuego):
          - Movimiento: W, A, S, D
          - Saltar: W
          
          Jugador 2 (Agua):
          - Movimiento: Flechas
          - Saltar: Flecha Arriba
          
          "@ | Out-File -FilePath "$packageName/README.txt" -Encoding UTF8
          
          # Crear ZIP
          Compress-Archive -Path "$packageName" -DestinationPath "$packageName.zip" -Force
          
          echo "PACKAGE_NAME=$packageName" >> $env:GITHUB_ENV
          echo "PACKAGE_FILE=$packageName.zip" >> $env:GITHUB_ENV

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ${{ env.PACKAGE_FILE }}
          retention-days: 90

  build-linux:
    name: Build Linux (CMake)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libasound2-dev

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Package Linux Release
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          
          PACKAGE_NAME="fire-and-water-dca-linux-${VERSION}"
          
          mkdir -p "${PACKAGE_NAME}"
          
          # Copiar ejecutable
          if [ -f "build/game" ]; then
            cp "build/game" "${PACKAGE_NAME}/"
          fi
          chmod +x "${PACKAGE_NAME}/game"
          
          # Copiar assets
          cp -r assets "${PACKAGE_NAME}/"
          
          # Crear README
          cat > "${PACKAGE_NAME}/README.txt" << EOF
          # Fire and Water DCA - Linux Release
          
          Version: ${VERSION}
          Build: CMake Release
          Date: $(date '+%Y-%m-%d %H:%M:%S')
          
          ## Instrucciones
          
          1. Abre una terminal en esta carpeta
          2. Ejecuta: ./game
          3. ¡Disfruta del juego!
          
          ## Requisitos del Sistema
          
          - Linux (64-bit)
          - OpenGL 3.3 o superior
          - X11 Window System
          - ALSA para audio
          
          ## Controles
          
          Jugador 1 (Fuego):
          - Movimiento: W, A, S, D
          - Saltar: W
          
          Jugador 2 (Agua):
          - Movimiento: Flechas
          - Saltar: Flecha Arriba
          
          EOF
          
          # Crear tarball
          tar -czf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"
          
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV
          echo "PACKAGE_FILE=${PACKAGE_NAME}.tar.gz" >> $GITHUB_ENV

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: ${{ env.PACKAGE_FILE }}
          retention-days: 90

  publish-release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
