name: CMake Release Build

on:
  release:
    types: [created, published]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'dev-build'

jobs:
  build-linux:
    name: Build Linux (CMake)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libasound2-dev

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Package Linux Release
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          
          PACKAGE_NAME="fire-and-water-dca-linux-${VERSION}"
          
          mkdir -p "${PACKAGE_NAME}"
          
          
          if [ -f "build/game" ]; then
            cp "build/game" "${PACKAGE_NAME}/"
          fi
          chmod +x "${PACKAGE_NAME}/game"
          
          
          cp -r assets "${PACKAGE_NAME}/"
          
         
          cat > "${PACKAGE_NAME}/README.txt" << EOF
          # Fire and Water DCA - Linux Release
          
          Version: ${VERSION}
          Build: CMake Release
          Date: $(date '+%Y-%m-%d %H:%M:%S')
          
          ## Instrucciones
          
          1. Abre una terminal en esta carpeta
          2. Ejecuta: ./game
          
          
          ## Requisitos del Sistema
          
          - Linux (64-bit)
          - OpenGL 3.3 o superior
          - X11 Window System
          - ALSA para audio
          
          ## Controles
          
          Jugador 1 (Fuego):
          - Movimiento: W, A, S, D
          - Saltar: W
          
          Jugador 2 (Agua):
          - Movimiento: Flechas
          - Saltar: Flecha Arriba
          
          EOF
          
          # Crear tarball
          tar -czf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"
          
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV
          echo "PACKAGE_FILE=${PACKAGE_NAME}.tar.gz" >> $GITHUB_ENV

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: ${{ env.PACKAGE_FILE }}
          retention-days: 90

  publish-release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: build-linux
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
