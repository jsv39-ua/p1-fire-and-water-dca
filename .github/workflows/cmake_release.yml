name: CMake Release CI

on:
  push:
    # Release on tags like v1.2.3
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

jobs:
  build-and-package:
    name: Build and package (Linux + Windows)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        config: [Release]
    env:
      RAYLIB_TAG: v4.5.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: cmake-actions/setup-cmake@v1

      - name: Configure
        run: |
          mkdir -p build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DRAYLIB_TAG=${{ env.RAYLIB_TAG }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} -- -j$(nproc || 2)

      - name: Package (CPack)
        run: |
          pushd build
          # Generate ZIP on windows and zip + deb on linux, let CPack pick available generators
          cpack -C ${{ matrix.config }}
          popd

      - name: Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cmake-packages-${{ matrix.os }}
          path: build/*.zip, build/*.deb

  publish:
    name: Create GitHub Release & Upload
    runs-on: ubuntu-latest
    needs: build-and-package
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: cmake-packages-ubuntu-latest
          path: artifacts

      - name: Create Release (if tag)
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets to Release
        if: steps.create_release.outputs.id != ''
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts
          asset_name: cmake-packages-ubuntu-latest.zip
          asset_content_type: application/zip

