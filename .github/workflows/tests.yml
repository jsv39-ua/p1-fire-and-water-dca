name: C++ Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test_ubuntu:
    name: Build and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libboost-test-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libasound2-dev \
            xvfb

      - name: Configure CMake with Tests
        run: cmake -B build -S . -DBUILD_GAME_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run CTest
        working-directory: build
        run: xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" ctest --output-on-failure

  test_windows:
    name: Ejecutar tests en Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
          choco install boost-msvc2019

      - name: Configure CMake with Tests
        run: cmake -B build -S . -DBUILD_GAME_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run CTest
        working-directory: build
        run: ctest --output-on-failure -C Release
    
