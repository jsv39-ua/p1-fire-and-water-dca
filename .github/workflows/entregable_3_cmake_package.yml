name: Entregable 3 - CMake, Multiplataforma y CPack

permissions:
  contents: read
  packages: write
  issues: write
  pull-requests: write
  # Add this if you are interacting with releases:
  actions: write

on:
  # Se ejecuta automáticamente al crear o publicar una release
  release:
    types: [created, published]
  # Permite ejecutarlo manualmente para pruebas
  workflow_dispatch:

jobs:
  build_linux:
    name: Linux Build and Package (.tar.gz + .deb)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Dependencias de Compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libasound2-dev

      - name: Configurar CMake
        run: cmake -B build-linux -S . -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build-linux --config Release --parallel

      - name: Generar Paquetes con CPack (.tar.gz y .deb)
        working-directory: build-linux
        run: cpack -G "DEB;TGZ"

      - name: Subir Artefactos de Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: |
            build-linux/*.tar.gz
            build-linux/*.deb

  build_windows:
    name: Windows Build and Package (.zip)
    runs-on: windows-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar CMake
        run: cmake -B build-windows -S . -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build-windows --config Release --parallel

      - name: Generar Paquete con CPack (.zip)
        working-directory: build-windows
        run: cpack -G "ZIP" -C Release
        
      - name: Subir Artefacto de Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: build-windows/*.zip

  publish_release_assets:
    name: Publicar Paquetes en Release
    runs-on: ubuntu-latest
    needs: [build_linux, build_windows]
    if: github.event_name == 'release'

    steps:
      - name: Descargar Artefactos (Linux y Windows)
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publicar Paquetes en GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/linux-package/*
            artifacts/windows-package/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
